<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>数据报告助手 Add-in Entry</title>
  <script>
    (function () {
      // 先声明 Ribbon 回调，避免 WPS 在 main.js 尚未完成加载时出现“xxx is not defined”。
      window.OnAddinLoad = function (ribbonUI) {
        if (typeof window.__RA_OnAddinLoad === 'function') return window.__RA_OnAddinLoad(ribbonUI);
        window.__RA_RibbonUI = ribbonUI;
        return true;
      };
      window.OnGetEnabled = function (control) {
        if (typeof window.__RA_OnGetEnabled === 'function') return window.__RA_OnGetEnabled(control);
        return true;
      };
      window.OnAction = function (control) {
        if (typeof window.__RA_OnAction === 'function') return window.__RA_OnAction(control);
        window.__RA_PendingOpen = true;
        return true;
      };
    })();
  </script>
  <script src="./main.js"></script>
</head>
<body></body>
</html>
