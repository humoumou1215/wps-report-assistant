<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据报告助手</title>
  <link rel="stylesheet" href="../wpp/common.css">
  <link rel="stylesheet" href="../wpp/history.css">
  <link rel="stylesheet" href="./workspace.css">
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="header-main">
      <button id="projectButton" class="project-switch">选择项目 ▾</button>
      <div class="toolbar"><button id="settingsBtn" class="iconbtn" aria-label="设置">设置</button><button id="reload" class="iconbtn">刷新</button></div>
    </div>
    <div id="currentFile" class="file-context">正在连接当前文件…</div>
    <div id="renderTimeline" class="render-timeline" aria-label="最近修改"></div>
    <div class="statusbar"><span class="dot" id="coreDot"></span><span id="coreState">连接中</span><span id="hostState"></span></div>
  </header>
  <nav class="workspace-nav" aria-label="工作区">
    <button id="viewConversation">会话</button><button id="viewData">变量</button><button id="viewSettings">设置</button>
  </nav>
  <div id="message" class="notice hidden" role="alert"></div>
  <div id="changeFeedback" class="change-feedback hidden" role="status" aria-live="polite"></div>
  <div id="changeQuickActions" class="change-quick-actions hidden"><button id="undoRecentInline">撤销最近修改</button><button id="openChangeHistory" class="quiet">查看修改历史</button></div>

  <section id="settingsPanel" class="card hidden" data-view="settings">
    <div class="section-head"><h2>设置</h2><button id="closeSettings" class="quiet">返回会话</button></div>
    <p class="hint">AI 连接、文档修改权限与界面偏好。API Key 仅保存在本机。</p>
    <div class="stack">
      <h3>AI 连接</h3>
      <label><input id="aiEnabled" type="checkbox" style="width:auto"> 启用 AI</label>
      <input id="aiBaseUrl" placeholder="OpenAI 兼容 Base URL">
      <input id="aiModel" placeholder="模型名称">
      <input id="aiKey" type="password" placeholder="API Key（本地保存）">
      <div class="divider"></div>
      <h3>自动化</h3>
      <label class="field-label">文档修改权限<select id="renderExecutionMode"><option value="review">审慎 · 每次修改前确认</option><option value="auto-reversible">自动可逆</option><option value="auto">自动（仍禁止不可逆修改）</option></select></label>
      <label><input id="autoRefreshVariables" type="checkbox" style="width:auto"> 源数据变化后自动重算变量，不自动改文档</label>
      <div class="divider"></div>
      <h3>界面</h3>
      <label class="field-label">修改时间线<select id="timelineScope"><option value="current-document">当前文档</option><option value="project">整个项目</option></select></label>
      <label><input id="liveVariableStatus" type="checkbox" style="width:auto"> 显示变量与输出的新旧状态</label>
      <button id="saveSettings" class="primary">保存设置</button>
    </div>
  </section>

  <section class="card hidden" data-view="project">
    <div class="section-head"><h2>项目与文件</h2><button id="backProject" class="quiet">返回</button></div>
    <p class="muted">将相关文件加入同一项目，共享数据与输出规则。</p>
    <div class="stack">
      <select id="projectSelect" aria-label="选择项目"></select>
      <button id="joinProject">将当前文件加入项目</button>
      <label class="field-label">新项目名称<input id="projectName" placeholder="例如：年度预算报告"></label>
      <button id="newProject" class="primary">创建并加入</button>
    </div>
    <div class="divider"></div><div id="projectFiles"></div>
  </section>

  <section class="card conversation-card hidden" data-view="conversation">
    <div class="section-head">
      <div class="conversation-heading"><h2 id="conversationTitle">会话</h2><select id="conversationSelect" aria-label="切换会话"></select><div id="conversationProject" class="muted"></div></div>
      <div class="conversation-tools"><button id="conversationMore" class="quiet" aria-label="会话菜单">⋯</button><button id="newConversation" class="quiet">新建</button></div>
    </div>
    <div id="conversationMenu" class="conversation-menu hidden"><button id="renameConversation">重命名</button><button id="compactConversation">压缩上下文</button><button id="archiveConversation">归档会话</button></div>
    <div id="conversationMessages" class="conversation-messages"><div class="empty">正在加载会话…</div></div>
    <div class="composer"><div id="referenceChips" class="reference-chips"></div><textarea id="conversationInput" placeholder="描述要完成的工作，输入 @ 引用变量、文件、选区或 Render 记录"></textarea><div class="composer-actions"><button id="insertReference" class="quiet">@ 引用</button><button id="sendConversation" class="primary">发送</button></div></div>
  </section>

  <section class="card hidden" data-view="data">
    <div class="section-head"><h2>变量 <span id="dataCount" class="muted"></span></h2><button id="newVariable" class="primary">＋ 提取数据</button></div>
    <input id="searchVariables" class="search" aria-label="搜索变量" placeholder="搜索名称或用途">
    <div id="variableList"></div>
  </section>
  <section class="card hidden" data-view="variable-detail">
    <div class="section-head"><h2 id="detailTitle">变量</h2><button data-back="data" class="quiet">返回</button></div>
    <div id="variableDetail"></div><div class="sticky-actions"><button id="askAboutVariable" class="primary">在会话中修改或分析</button></div>
  </section>
  <section id="historySection" class="card history-card hidden" data-view="history">
    <div class="section-head"><h2>修改历史</h2><button id="reloadHistory" class="quiet">刷新</button></div>
    <p class="muted">查看插件写入、验证、恢复与撤销的不可变记录。</p>
    <button id="undoLatest" disabled>撤销最近修改</button><div id="changeHistory"></div>
  </section>
</div>
<div id="toast"></div>
<script src="../wpp/common.js"></script>
<script src="../wpp/change-state.js"></script>
<script src="./hosts.js"></script>
<script src="./extensions.js"></script>
<script src="../wpp/change-history.js"></script>
<script src="./workspace.js"></script>
<script src="./conversation.js"></script>
</body>
</html>
